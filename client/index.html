<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Cube Connect 4
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>
Cube Connect 4
</h1>



<button id="menuToggle">
メニュー非表示
</button>


<div id="menu">

<!-- ======================
     CPU対戦
====================== -->

<section>

<h2>
CPU対戦
</h2>


<h3>
モード選択
</h3>


<button id="cpuFree">
自由配置
</button>


<button id="cpuGravity">
重力あり
</button>


</section>







<!-- ======================
     オンライン対戦
====================== -->

<section>

<h2>
オンライン対戦
</h2>



<h3>
名前
</h3>


<input
id="playerName"
type="text"
placeholder="名前を入力">





<h3>
モード選択
</h3>


<button id="onlineFree">
自由配置
</button>


<button id="onlineGravity">
重力あり
</button>





<h3>
部屋作成
</h3>


<button id="createRoom">
部屋を作る
</button>

<p id="roomDisplay">
</p>





<h3>
参加
</h3>


<input
id="roomId"
type="text"
placeholder="部屋番号">


<button id="joinRoom">
参加する
</button>



</section>


</div>








<!-- ======================
     状態
====================== -->


<section id="statusBox">

<h2>
状態
</h2>


<p id="status">
サーバー接続待ち...
</p>


<button id="resetGame">
リセット
</button>



</section>



<script src="/socket.io/socket.io.js"></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


<script src="network.js"></script>


<script src="board.js"></script>


</body>

</html>
